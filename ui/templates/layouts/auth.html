{{define "auth"}}
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{block "title" .}}InkFetch{{end}}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("inkfetch-theme");
          if (t === "dark" || t === "light" || t === "violet" || t === "neon-blue" || t === "crimson" || t === "emerald") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (_e) {}
      })();
    </script>
    <link rel="stylesheet" href="/static/inkfetch.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-box">
        <div class="auth-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M12 3 18 11.5 12 21 6 11.5 12 3Z" />
              <path d="M12 3v9" />
            </svg>
          </span>
          <span class="brand-name">InkFetch</span>
        </div>
        {{block "auth-content" .}}{{end}}
      </div>
    </div>
  </body>
</html>
{{end}}
