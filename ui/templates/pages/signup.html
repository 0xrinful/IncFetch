{{template "auth" .}}
{{define "title"}}Create Account — InkFetch{{end}}
{{define "auth-content"}}
  <div class="auth-panel">
    <div>
      <h1 class="auth-heading">Create account</h1>
      <p class="auth-sub">Set up your local InkFetch manga library.</p>
    </div>

    {{if .Error}}
      <div class="alert-error" role="alert">{{.Error}}</div>
    {{end}}

    <form method="post" action="/signup" style="display:flex;flex-direction:column;gap:12px;">
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input id="email" class="input input-full" type="email" name="email" value="{{.Email}}" autocomplete="email" required />
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input id="password" class="input input-full" type="password" name="password" autocomplete="new-password" minlength="4" required />
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;margin-top:4px;">Create Account</button>
    </form>
  </div>

  <p class="auth-footer">
    Already have an account? <a href="/login">Sign in</a>
  </p>
{{end}}
